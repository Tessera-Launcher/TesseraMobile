[package]
name = "tessera-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "Tessera for phones: a touch-first launcher UI built with Slint"
publish = false

[lib]
name = "tessera_mobile"
# `cdylib` is what Android loads; `rlib` keeps `cargo run` working on the host.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tessera-mobile"
path = "src/main.rs"

[dependencies]
# `backend-android-activity-06` is inert on desktop, so it stays always-on and
# both targets share one dependency line.
slint = { version = "1.19", features = ["backend-android-activity-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The launcher ids `data/凭据/启动器/azure_app_ids.toml` is written in.
toml = "1"
# Vendored Microsoft → Xbox Live → Minecraft sign-in. The crate keeps its own
# [workspace]; a path dependency on it is still fine.
minecraft-auth = { path = "vendor/minecraft-auth" }
# Offline identities: Java's `UUID.nameUUIDFromBytes` is MD5 over
# `OfflinePlayer:<name>` (RFC 4122 version 3).
md5 = { package = "md-5", version = "0.10" }
hex = "0.4"

# Sign-in runs on its own thread with a current-thread runtime; nothing on the
# UI thread ever awaits.
tokio = { version = "1", features = ["rt", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
tempfile = "3"

# Android packaging metadata for cargo-apk2 (`[package.metadata.android.*]`).
# The activity has to be `android.app.NativeActivity` (or a subclass of it):
# that is the base class Slint's Android backend drives.
[package.metadata.android]
package = "org.tessera.mobile"
apk_name = "tessera"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 28

[package.metadata.android.application]
label = "Tessera"
extract_native_libs = true

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "tessera_mobile"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[profile.dev]
opt-level = 1
debug = false

[profile.release]
lto = "fat"
strip = true
# Phone UI means a lot of redraw on a small surface; size still wins, but the
# layout code benefits from a little speed.
opt-level = "s"
codegen-units = 1
